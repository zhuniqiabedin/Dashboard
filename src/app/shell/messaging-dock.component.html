<aside class="fixed right-4 bottom-0 z-40 w-[min(360px,calc(100vw-2rem))] sm:right-6" aria-label="Messaging">
  @if (open) {
    <section
      class="mb-0 flex h-[min(480px,72dvh)] flex-col overflow-hidden border border-stone-200 bg-white shadow-[0_8px_36px_rgba(15,23,42,.2)]"
      aria-label="Recent messages"
    >
      <header class="flex items-center justify-between border-b border-stone-100 px-4 py-3">
        <div>
          <h2 class="text-base font-semibold text-slate-900">Messaging</h2>
          <p class="text-xs text-stone-500">Your recent conversations</p>
        </div>
        <div class="flex items-center gap-1">
          <button
            type="button"
            class="rounded-lg px-2.5 py-1.5 text-xs font-semibold text-[#0a66c2] hover:bg-blue-50"
            (click)="openInbox()"
          >
            See all
          </button>
          <button
            type="button"
            class="grid size-8 place-items-center rounded-full text-lg text-stone-500 hover:bg-stone-100"
            aria-label="Close messaging"
            (click)="open = false"
          >
            ×
          </button>
        </div>
      </header>

      <div class="min-h-0 flex-1 overflow-y-auto">
        @if (loading && !conversations.length) {
          <p class="p-5 text-center text-sm text-stone-500">Loading conversations…</p>
        } @else {
          @for (conversation of conversations; track conversation._id) {
            <button
              type="button"
              class="flex w-full items-center gap-3 border-b border-stone-100 px-4 py-3 text-left transition hover:bg-slate-50"
              (click)="openConversation(conversation)"
            >
              <span class="relative grid size-11 shrink-0 place-items-center overflow-hidden rounded-full bg-[#e8f0ff] text-sm font-semibold text-[#2864dc]">
                @if (conversationPhoto(conversation)) {
                  <img [src]="conversationPhoto(conversation)" alt="" class="size-full object-cover" />
                } @else {
                  {{ initials(conversationTitle(conversation)) }}
                }
              </span>
              <span class="min-w-0 flex-1">
                <span class="flex items-center justify-between gap-2">
                  <b class="truncate text-sm text-slate-900">{{ conversationTitle(conversation) }}</b>
                  <small class="shrink-0 text-[10px] text-stone-400">{{ lastMessage(conversation)?.createdAt | date: 'shortTime' }}</small>
                </span>
                <span class="mt-1 flex items-center justify-between gap-2">
                  <span class="truncate text-xs text-stone-500">{{ lastMessagePreview(conversation) }}</span>
                  @if (unreadFor(conversation)) {
                    <span class="grid size-5 shrink-0 place-items-center rounded-full bg-[#0a66c2] text-[10px] font-semibold text-white">{{ unreadFor(conversation) }}</span>
                  }
                </span>
              </span>
            </button>
          } @empty {
            <div class="px-6 py-12 text-center">
              <div class="mx-auto grid size-12 place-items-center rounded-full bg-slate-100 text-slate-500">✉</div>
              <p class="mt-3 text-sm font-medium text-slate-700">No conversations yet</p>
              <p class="mt-1 text-xs text-stone-500">Messages will appear here when someone writes to you.</p>
            </div>
          }
        }
      </div>
      <button
        type="button"
        class="border-t border-stone-100 py-3 text-center text-xs font-semibold text-[#0a66c2] hover:bg-blue-50"
        (click)="openInbox()"
      >
        Open full inbox
      </button>
    </section>
  }

  <button
    type="button"
    class="flex h-14 w-full items-center gap-3 border border-b-0 border-stone-200 bg-white px-3 text-left shadow-[0_4px_20px_rgba(15,23,42,.16)] transition hover:bg-slate-50"
    [class.rounded-t-xl]="!open"
    [attr.aria-expanded]="open"
    aria-label="Toggle messaging panel"
    (click)="toggle()"
  >
    <span class="relative grid size-9 shrink-0 place-items-center overflow-hidden rounded-full bg-[#e8f0ff] text-xs font-semibold text-[#2864dc]">
      @if (user?.photo) {
        <img [src]="user.photo" alt="" class="size-full object-cover" />
      } @else {
        {{ initials(user?.name || 'You') }}
      }
      @if (unreadCount()) {
        <i class="absolute right-0 bottom-0 size-3 rounded-full border-2 border-white bg-[#0a66c2]"></i>
      }
    </span>
    <span class="flex-1 text-sm font-semibold text-slate-900">Messaging</span>
    @if (unreadCount()) {
      <span class="rounded-full bg-[#0a66c2] px-2 py-0.5 text-[10px] font-semibold text-white">{{ unreadCount() }}</span>
    }
    <span class="text-xs text-stone-500">{{ open ? '⌄' : '⌃' }}</span>
  </button>
</aside>
